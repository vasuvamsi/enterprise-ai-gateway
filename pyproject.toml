[project]
name = "enterprise-ai-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
enterprise-ai-gateway = "enterprise_ai_gateway:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
